services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Single listener setup (clean & stable)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "
      sleep 10 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --replication-factor 1 --partitions 3 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic trades --replication-factor 1 --partitions 3 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order-events --replication-factor 1 --partitions 3 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic orders-dlq --replication-factor 1 --partitions 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic trades-dlq --replication-factor 1 --partitions 1"

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: tradesphere
      POSTGRES_PASSWORD: tradesphere
      POSTGRES_DB: tradesphere
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesphere -d tradesphere"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-migrate:
    image: migrate/migrate:v4.17.1
    container_name: db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://tradesphere:tradesphere@postgres:5432/tradesphere?sslmode=disable",
        "up"
      ]
    volumes:
      - ./infra/postgres/migrations:/migrations:ro

  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    container_name: order-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: postgres
      JWT_SECRET: tradesphere-secret-key

  matching-engine:
    build:
      context: .
      dockerfile: ./services/matching-engine/Dockerfile
    container_name: matching-engine
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "8082:8082"
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: postgres
      JWT_SECRET: tradesphere-secret-key

  portfolio-service:
    build:
      context: .
      dockerfile: ./services/portfolio-service/Dockerfile
    container_name: portfolio-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: postgres
      KAFKA_GROUP_ID: portfolio-service
      RECONCILIATION_INTERVAL: 1m
      JWT_SECRET: tradesphere-secret-key

  websocket-service:
    build:
      context: .
      dockerfile: ./services/websocket-service/Dockerfile
    container_name: websocket-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: postgres
      JWT_SECRET: tradesphere-secret-key

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    container_name: user-service
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      JWT_SECRET: tradesphere-secret-key

  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      - user-service
      - order-service
      - portfolio-service
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: tradesphere-secret-key

volumes:
  kafka-data:
  postgres-data:
