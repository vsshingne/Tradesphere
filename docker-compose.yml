services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Single listener setup (clean & stable)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "
      sleep 10 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --replication-factor 1 --partitions 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic trades --replication-factor 1 --partitions 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order-events --replication-factor 1 --partitions 1"

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: tradesphere
      POSTGRES_PASSWORD: tradesphere
      POSTGRES_DB: tradesphere
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesphere -d tradesphere"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build: ./services/order-service
    container_name: order-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: postgres

  matching-engine:
    build: ./services/matching-engine
    container_name: matching-engine
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: postgres

  portfolio-service:
    build: ./services/portfolio-service
    container_name: portfolio-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: postgres
      KAFKA_GROUP_ID: portfolio-service

  websocket-service:
    build: ./services/websocket-service
    container_name: websocket-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: postgres

volumes:
  kafka-data:
  postgres-data:
