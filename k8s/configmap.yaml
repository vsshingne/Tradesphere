apiVersion: v1
kind: ConfigMap
metadata:
  name: tradesphere-config
  namespace: tradesphere
  labels:
    app.kubernetes.io/part-of: tradesphere
data:
  POSTGRES_DB: "tradesphere"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  DB_HOST: "postgres"
  KAFKA_BROKER: "kafka:9092"
  RECONCILIATION_INTERVAL: "1m"
  KAFKA_GROUP_ID: "portfolio-service"
  # OpenTelemetry tracing endpoint (Jaeger)
  OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4318"
