---
# PostgreSQL init SQL as ConfigMap (embedded from infra/postgres/init.sql)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: tradesphere
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE IF NOT EXISTS users (
        id UUID PRIMARY KEY,
        email TEXT UNIQUE,
        password_hash TEXT,
        role TEXT DEFAULT 'user',
        balance BIGINT NOT NULL DEFAULT 0,
        reserved_balance BIGINT NOT NULL DEFAULT 0,
        created_at TIMESTAMP NOT NULL DEFAULT NOW(),
        CONSTRAINT users_balance_non_negative CHECK (balance >= 0),
        CONSTRAINT users_reserved_balance_non_negative CHECK (reserved_balance >= 0)
    );

    CREATE TABLE IF NOT EXISTS refresh_tokens (
        id UUID PRIMARY KEY,
        user_id UUID NOT NULL,
        token_hash TEXT NOT NULL UNIQUE,
        expires_at TIMESTAMP NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT NOW(),
        revoked_at TIMESTAMP,
        CONSTRAINT fk_refresh_tokens_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
    );
    CREATE INDEX IF NOT EXISTS idx_refresh_tokens_user_id ON refresh_tokens(user_id);
    CREATE INDEX IF NOT EXISTS idx_refresh_tokens_hash ON refresh_tokens(token_hash);

    CREATE TABLE IF NOT EXISTS positions (
        user_id UUID NOT NULL,
        symbol TEXT NOT NULL,
        quantity BIGINT NOT NULL DEFAULT 0,
        reserved_quantity BIGINT NOT NULL DEFAULT 0,
        PRIMARY KEY (user_id, symbol),
        CONSTRAINT fk_positions_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        CONSTRAINT positions_quantity_non_negative CHECK (quantity >= 0),
        CONSTRAINT positions_reserved_quantity_non_negative CHECK (reserved_quantity >= 0)
    );

    CREATE TABLE IF NOT EXISTS orders (
        id UUID PRIMARY KEY,
        user_id UUID NOT NULL,
        symbol TEXT NOT NULL,
        side TEXT NOT NULL,
        type TEXT NOT NULL DEFAULT 'LIMIT',
        price BIGINT NOT NULL,
        quantity BIGINT NOT NULL,
        remaining_quantity BIGINT NOT NULL,
        reserved_amount BIGINT NOT NULL DEFAULT 0,
        status TEXT NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT NOW(),
        CONSTRAINT fk_orders_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        CONSTRAINT orders_price_positive CHECK (price >= 0),
        CONSTRAINT orders_quantity_positive CHECK (quantity > 0),
        CONSTRAINT orders_remaining_quantity_non_negative CHECK (remaining_quantity >= 0),
        CONSTRAINT orders_reserved_amount_non_negative CHECK (reserved_amount >= 0),
        CONSTRAINT orders_status_valid CHECK (status IN ('NEW','PARTIALLY_FILLED','FILLED','CANCELLED')),
        CONSTRAINT orders_side_valid CHECK (side IN ('BUY','SELL')),
        CONSTRAINT orders_type_valid CHECK (type IN ('LIMIT','MARKET'))
    );
    CREATE INDEX IF NOT EXISTS idx_orders_symbol ON orders(symbol);
    CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status);

    CREATE TABLE IF NOT EXISTS trades (
        id UUID PRIMARY KEY,
        symbol TEXT NOT NULL,
        buyer_user_id UUID NOT NULL,
        seller_user_id UUID NOT NULL,
        buy_order_id UUID NOT NULL,
        sell_order_id UUID NOT NULL,
        price BIGINT NOT NULL,
        quantity BIGINT NOT NULL,
        executed_at TIMESTAMP NOT NULL,
        CONSTRAINT fk_trades_buyer FOREIGN KEY (buyer_user_id) REFERENCES users(id),
        CONSTRAINT fk_trades_seller FOREIGN KEY (seller_user_id) REFERENCES users(id),
        CONSTRAINT fk_trades_buy_order FOREIGN KEY (buy_order_id) REFERENCES orders(id),
        CONSTRAINT fk_trades_sell_order FOREIGN KEY (sell_order_id) REFERENCES orders(id),
        CONSTRAINT trades_price_positive CHECK (price > 0),
        CONSTRAINT trades_quantity_positive CHECK (quantity > 0)
    );
    CREATE INDEX IF NOT EXISTS idx_trades_symbol ON trades(symbol);
    CREATE INDEX IF NOT EXISTS idx_trades_executed_at ON trades(executed_at);

    CREATE TABLE IF NOT EXISTS order_outbox (
        id UUID PRIMARY KEY,
        topic TEXT NOT NULL,
        event_key TEXT NOT NULL,
        payload JSONB NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT NOW(),
        published_at TIMESTAMP NULL,
        publish_attempts INTEGER NOT NULL DEFAULT 0,
        next_attempt_at TIMESTAMP NOT NULL DEFAULT NOW(),
        claimed_by TEXT NULL,
        claimed_at TIMESTAMP NULL,
        last_error TEXT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_order_outbox_unpublished ON order_outbox(published_at, created_at);
    CREATE INDEX IF NOT EXISTS idx_order_outbox_publishable ON order_outbox(published_at, next_attempt_at, created_at);

    CREATE TABLE IF NOT EXISTS trade_outbox (
        id UUID PRIMARY KEY,
        topic TEXT NOT NULL,
        event_key TEXT NOT NULL,
        payload JSONB NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT NOW(),
        published_at TIMESTAMP NULL,
        publish_attempts INTEGER NOT NULL DEFAULT 0,
        next_attempt_at TIMESTAMP NOT NULL DEFAULT NOW(),
        claimed_by TEXT NULL,
        claimed_at TIMESTAMP NULL,
        last_error TEXT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_trade_outbox_unpublished ON trade_outbox(published_at, created_at);
    CREATE INDEX IF NOT EXISTS idx_trade_outbox_publishable ON trade_outbox(published_at, next_attempt_at, created_at);

    CREATE TABLE IF NOT EXISTS processed_events (
        consumer_group TEXT NOT NULL,
        event_id UUID NOT NULL,
        processed_at TIMESTAMP NOT NULL DEFAULT NOW(),
        PRIMARY KEY (consumer_group, event_id)
    );

    INSERT INTO users (id, email, password_hash, role, balance)
    VALUES
    ('11111111-1111-1111-1111-111111111111', 'user1@example.com',
     '$2a$10$Y3ScnMmM9dd9R5mY/Eolf.OBpHxk1htdXLqZFwv/UbGskYmr3njc2', 'user', 1000000000000000),
    ('22222222-2222-2222-2222-222222222222', 'user2@example.com',
     '$2a$10$Y3ScnMmM9dd9R5mY/Eolf.OBpHxk1htdXLqZFwv/UbGskYmr3njc2', 'user', 1000000000000000)
    ON CONFLICT DO NOTHING;

    INSERT INTO positions (user_id, symbol, quantity)
    VALUES ('22222222-2222-2222-2222-222222222222', 'BTC', 10000000000)
    ON CONFLICT DO NOTHING;

---
# Zookeeper StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: tradesphere
  labels:
    app: zookeeper
spec:
  ports:
    - port: 2181
      name: client
    - port: 2888
      name: follower
    - port: 3888
      name: election
  clusterIP: None
  selector:
    app: zookeeper
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: tradesphere
  labels:
    app: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: tradesphere
spec:
  serviceName: "zookeeper-headless"
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-log
              mountPath: /var/lib/zookeeper/log
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 30
            periodSeconds: 20
          startupProbe:
            tcpSocket:
              port: 2181
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: zookeeper-log
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
# Kafka StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: tradesphere
  labels:
    app: kafka
spec:
  ports:
    - port: 9092
      name: kafka
  clusterIP: None
  selector:
    app: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: tradesphere
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: tradesphere
spec:
  serviceName: "kafka-headless"
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
          startupProbe:
            tcpSocket:
              port: 9092
            failureThreshold: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---
# Kafka Topic Init Job — runs once after Kafka is ready
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: tradesphere
  annotations:
    # Re-run with: kubectl delete job kafka-init -n tradesphere
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: kafka-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.5.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until kafka-topics --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
                echo "Kafka not ready, retrying in 5s..."
                sleep 5
              done
              echo "Kafka ready — creating topics..."
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
                --topic orders --replication-factor 1 --partitions 3
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
                --topic trades --replication-factor 1 --partitions 3
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
                --topic order-events --replication-factor 1 --partitions 3
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
                --topic orders-dlq --replication-factor 1 --partitions 1
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
                --topic trades-dlq --replication-factor 1 --partitions 1
              echo "All topics created successfully:"
              kafka-topics --bootstrap-server kafka:9092 --list

---
# PostgreSQL StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: tradesphere
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      name: postgres
  clusterIP: None
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tradesphere
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tradesphere
spec:
  serviceName: "postgres-headless"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: tradesphere-config
            - secretRef:
                name: tradesphere-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
# DB Migration Job — runs golang-migrate after PostgreSQL is ready
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: tradesphere
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          command:
            - /bin/sh
            - -c
            - |
              echo "Running database migrations..."
              migrate \
                -path /migrations \
                -database "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable" \
                up
              echo "Migrations complete."
          envFrom:
            - secretRef:
                name: tradesphere-secret
            - configMapRef:
                name: tradesphere-config
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: migrations
          configMap:
            name: db-migrations

---
# DB Migrations ConfigMap — embeds SQL migration files
# NOTE: In GKE production, mount these from a persistent volume or include in the image
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-migrations
  namespace: tradesphere
  annotations:
    # This configmap must be kept in sync with infra/postgres/migrations/
    # For production, prefer baking migrations into a dedicated Docker image
    tradesphere.io/note: "Sync with infra/postgres/migrations/"
data:
  # Placeholder — in production use a migration image or kustomize to embed files
  # The init.sql handles the initial schema; migrations handle incremental changes
  README: |
    Database migrations are managed by golang-migrate.
    The init.sql creates the base schema.
    Incremental migrations in infra/postgres/migrations/ are applied by the db-migrate Job.
    
    For GKE production, build a custom migrate image containing the migration files:
      FROM migrate/migrate:v4.17.1
      COPY infra/postgres/migrations /migrations
