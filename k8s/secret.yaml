apiVersion: v1
kind: Secret
metadata:
  name: tradesphere-secret
  namespace: tradesphere
  labels:
    app.kubernetes.io/part-of: tradesphere
  annotations:
    # External Secrets Operator annotation (if using ESO + Google Secret Manager)
    # external-secrets.io/v1beta1: "true"
type: Opaque
data:
  # echo -n 'tradesphere' | base64
  POSTGRES_USER: dHJhZGVzcGhlcmU=
  # CHANGE IN PRODUCTION — use: openssl rand -base64 32
  POSTGRES_PASSWORD: dHJhZGVzcGhlcmU=
  # CHANGE IN PRODUCTION — use: openssl rand -hex 64 | base64
  JWT_SECRET: dHJhZGVzcGhlcmUtc2VjcmV0LWtleQ==
