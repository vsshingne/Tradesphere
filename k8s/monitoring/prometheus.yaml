apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tradesphere
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
      - /etc/prometheus/recording-rules.yml
    scrape_configs:
      - job_name: 'tradesphere-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - tradesphere
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: service
      - job_name: 'kafka-exporter'
        static_configs:
          - targets: ['kafka-exporter:9308']
  alerts.yml: |
    groups:
    - name: tradesphere.rules
      rules:
      - alert: HighDBLatency
        expr: histogram_quantile(0.99, sum(rate(tradesphere_db_query_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High DB latency"
          description: "99th percentile DB query duration is > 1s"
      - alert: HighReservationFailures
        expr: rate(tradesphere_reservation_failures_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High reservation failures"
          description: "High rate of balance/position reservation failures"
  recording-rules.yml: |
    groups:
    - name: tradesphere.recording
      rules:
      - record: job:tradesphere_orders:rate5m
        expr: sum(rate(tradesphere_orders_total[5m]))
      - record: job:tradesphere_trades:rate5m
        expr: sum(rate(tradesphere_trades_total[5m]))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: tradesphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.47.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/
            - name: prometheus-storage
              mountPath: /prometheus
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: tradesphere
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
