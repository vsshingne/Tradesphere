# ============================================================
# Matching Engine — Deployment, Service, PDB
# Port: 8082 | Stateful-in-memory | Single replica (see note)
# SCALING NOTE: Replicas must equal Kafka partitions for orders
# topic (currently 3). Do NOT scale independently of Kafka.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
  namespace: tradesphere
  labels:
    app: matching-engine
    app.kubernetes.io/part-of: tradesphere
  annotations:
    tradesphere.io/scaling-strategy: |
      The matching engine holds an in-memory order book reconstructed from PostgreSQL on startup.
      Scaling requires Kafka consumer group rebalancing where each replica handles a partition subset.
      Keep replicas <= Kafka partitions count (3) and ensure symbol-keyed routing consistency.
      Only scale when also increasing Kafka partitions.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1  # Briefly unavailable during updates is acceptable
  template:
    metadata:
      labels:
        app: matching-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      # Prefer running on dedicated node if possible
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - matching-engine
                topologyKey: kubernetes.io/hostname
      containers:
        - name: matching-engine
          image: REGISTRY/tradesphere-matching-engine:TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tradesphere-config
            - secretRef:
                name: tradesphere-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8082
            # Engine loads all open orders on startup — needs more time
            failureThreshold: 60
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: matching-engine
  namespace: tradesphere
  labels:
    app: matching-engine
spec:
  type: ClusterIP
  selector:
    app: matching-engine
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: matching-engine-pdb
  namespace: tradesphere
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: matching-engine

