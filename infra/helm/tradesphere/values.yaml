global:
  env:
    # Common shared environment variables
    ZOOKEEPER_CLIENT_PORT: "2181"
    ZOOKEEPER_TICK_TIME: "2000"
    KAFKA_BROKER_ID: "1"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

# -- Secrets config (Values will be generated into a Secret)
secrets:
  POSTGRES_USER: tradesphere
  POSTGRES_PASSWORD: tradesphere
  JWT_SECRET: tradesphere-secret-key

# -- ConfigMap (Values generated into a ConfigMap)
config:
  POSTGRES_DB: tradesphere
  KAFKA_BROKER: kafka:9092
  POSTGRES_HOST: postgres
  DB_HOST: postgres
  POSTGRES_PORT: "5432"

# -- Ingress settings
ingress:
  enabled: true
  className: "nginx"
  host: "tradesphere.local"
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "websocket-service"

# -- Stateful components
postgres:
  enabled: true
  image: "postgres:15"
  replicas: 1
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

kafka:
  enabled: true
  image: "confluentinc/cp-kafka:7.5.0"
  replicas: 1
  storage: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

zookeeper:
  enabled: true
  image: "confluentinc/cp-zookeeper:7.5.0"
  replicas: 1
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# -- Stateless Microservices
apiGateway:
  image: "tradesphere/api-gateway:latest"
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

userService:
  image: "tradesphere/user-service:latest"
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

orderService:
  image: "tradesphere/order-service:latest"
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

portfolioService:
  image: "tradesphere/portfolio-service:latest"
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

matchingEngine:
  image: "tradesphere/matching-engine:latest"
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi
  hpa:
    enabled: false # Scale replicas only alongside Kafka order-topic partitions
  pdb:
    enabled: true
    maxUnavailable: 1

websocketService:
  image: "tradesphere/websocket-service:latest"
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    enabled: false
  pdb:
    enabled: true
    maxUnavailable: 1

# -- Observability
observability:
  enabled: true
  prometheus:
    image: prom/prometheus:v2.45.0
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  grafana:
    image: grafana/grafana:10.0.3
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  loki:
    image: grafana/loki:2.8.2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  promtail:
    image: grafana/promtail:2.8.2
  jaeger:
    image: jaegertracing/all-in-one:1.47
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

frontend:
  enabled: true
  image: "tradesphere/frontend:latest"
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  enabled: false # Set to true in hardened environments

