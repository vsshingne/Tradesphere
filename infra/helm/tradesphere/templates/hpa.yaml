{{- $services := list "apiGateway" "userService" "orderService" "portfolioService" "matchingEngine" "websocketService" -}}
{{- range $svc := $services }}
{{- $config := index $.Values $svc }}
{{- if $config.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ kebabcase $svc }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ kebabcase $svc }}
  minReplicas: {{ $config.hpa.minReplicas }}
  maxReplicas: {{ $config.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $config.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
