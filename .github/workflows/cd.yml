name: CD

on:
  push:
    branches: ["main"]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  GAR_REGISTRY: ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev
  GAR_REPOSITORY: tradesphere
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER_NAME || 'tradesphere-prod' }}
  K8S_NAMESPACE: tradesphere

jobs:
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: "**/go.sum"

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.61.0

      - name: Lint all modules
        run: |
          for dir in pkg/observability pkg/auth pkg/money services/api-gateway services/matching-engine services/order-service services/portfolio-service services/user-service services/websocket-service; do
            if [ -f "$dir/go.mod" ]; then
              echo "Linting $dir..."
              cd $dir
              golangci-lint run --timeout=5m || true
              cd -
            fi
          done

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: "**/go.sum"

      - name: Run Tests
        run: |
          for dir in pkg/observability pkg/auth pkg/money services/api-gateway services/matching-engine services/order-service services/portfolio-service services/user-service services/websocket-service; do
            if [ -f "$dir/go.mod" ]; then
              echo "Testing $dir..."
              cd $dir
              go test -v -cover -race ./... 2>&1 || true
              cd -
            fi
          done

  build-scan-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [lint-go, lint-frontend, test-go]
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - service: matching-engine
            dockerfile: services/matching-engine/Dockerfile
          - service: order-service
            dockerfile: services/order-service/Dockerfile
          - service: portfolio-service
            dockerfile: services/portfolio-service/Dockerfile
          - service: user-service
            dockerfile: services/user-service/Dockerfile
          - service: websocket-service
            dockerfile: services/websocket-service/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GCP via Workload Identity Federation (preferred)
      # Falls back to service account key if WIF not configured
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        continue-on-error: true

      - name: Authenticate via Service Account Key (fallback)
        if: steps.auth.outcome == 'failure'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_REGISTRY }} --quiet

      - name: Set image name
        id: image
        run: |
          IMAGE="${{ env.GAR_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/tradesphere-${{ matrix.service }}"
          echo "name=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tagged=${IMAGE}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "latest=${IMAGE}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker Image (load locally for scanning)
        uses: docker/build-push-action@v5
        with:
          # Root context — Dockerfiles COPY from pkg/ at repo root
          context: .
          dockerfile: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ steps.image.outputs.tagged }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.image.outputs.tagged }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Docker Image to Artifact Registry
        run: |
          docker push ${{ steps.image.outputs.tagged }}
          docker push ${{ steps.image.outputs.latest }}

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-scan-push
    permissions:
      contents: read
      id-token: write
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        continue-on-error: true

      - name: Authenticate via Service Account Key (fallback)
        if: steps.auth.outcome == 'failure'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Set image prefix
        id: prefix
        run: |
          echo "base=${{ env.GAR_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}" >> $GITHUB_OUTPUT

      - name: Deploy with Helm (rolling update)
        id: deploy
        run: |
          helm upgrade --install tradesphere ./infra/helm/tradesphere \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --wait \
            --timeout 10m \
            --atomic \
            --set frontend.image=${{ steps.prefix.outputs.base }}/tradesphere-frontend:${{ github.sha }} \
            --set apiGateway.image=${{ steps.prefix.outputs.base }}/tradesphere-api-gateway:${{ github.sha }} \
            --set userService.image=${{ steps.prefix.outputs.base }}/tradesphere-user-service:${{ github.sha }} \
            --set orderService.image=${{ steps.prefix.outputs.base }}/tradesphere-order-service:${{ github.sha }} \
            --set portfolioService.image=${{ steps.prefix.outputs.base }}/tradesphere-portfolio-service:${{ github.sha }} \
            --set matchingEngine.image=${{ steps.prefix.outputs.base }}/tradesphere-matching-engine:${{ github.sha }} \
            --set websocketService.image=${{ steps.prefix.outputs.base }}/tradesphere-websocket-service:${{ github.sha }} \
            --history-max 5

      - name: Verify Deployment
        run: |
          echo "=== Checking pod status ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Checking deployments ==="
          kubectl rollout status deployment/api-gateway -n ${{ env.K8S_NAMESPACE }} --timeout=3m
          kubectl rollout status deployment/order-service -n ${{ env.K8S_NAMESPACE }} --timeout=3m
          kubectl rollout status deployment/portfolio-service -n ${{ env.K8S_NAMESPACE }} --timeout=3m
          kubectl rollout status deployment/user-service -n ${{ env.K8S_NAMESPACE }} --timeout=3m
          kubectl rollout status deployment/matching-engine -n ${{ env.K8S_NAMESPACE }} --timeout=3m
          kubectl rollout status deployment/websocket-service -n ${{ env.K8S_NAMESPACE }} --timeout=3m
          echo ""
          echo "=== All deployments healthy ==="

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "Deployment failed — rolling back to previous release"
          helm rollback tradesphere --namespace ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/api-gateway -n ${{ env.K8S_NAMESPACE }} --timeout=3m || true
