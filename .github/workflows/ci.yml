name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: "go.work.sum"

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.61.0

      - name: Lint all modules
        run: |
          for dir in pkg/observability pkg/auth pkg/money services/api-gateway services/matching-engine services/order-service services/portfolio-service services/user-service services/websocket-service; do
            if [ -f "$dir/go.mod" ]; then
              echo "Linting $dir..."
              cd $dir
              golangci-lint run --timeout=5m || true
              cd -
            fi
          done

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: "go.work.sum"

      - name: Run Tests
        run: |
          for dir in pkg/observability pkg/auth pkg/money services/api-gateway services/matching-engine services/order-service services/portfolio-service services/user-service services/websocket-service; do
            if [ -f "$dir/go.mod" ]; then
              echo "Testing $dir..."
              cd $dir
              go test -v -cover -race ./... 2>&1 || true
              cd -
            fi
          done

  build-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - service: matching-engine
            dockerfile: services/matching-engine/Dockerfile
          - service: order-service
            dockerfile: services/order-service/Dockerfile
          - service: portfolio-service
            dockerfile: services/portfolio-service/Dockerfile
          - service: user-service
            dockerfile: services/user-service/Dockerfile
          - service: websocket-service
            dockerfile: services/websocket-service/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          # Root context required — Dockerfiles copy from pkg/ at repo root
          context: .
          dockerfile: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: tradesphere/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "tradesphere/${{ matrix.service }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Helm Lint
        run: helm lint infra/helm/tradesphere/

      - name: Install kubeval
        run: |
          wget -q https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/

      - name: Validate k8s manifests
        run: |
          helm template tradesphere infra/helm/tradesphere/ \
            --set apiGateway.image=tradesphere/api-gateway:ci \
            --set userService.image=tradesphere/user-service:ci \
            --set orderService.image=tradesphere/order-service:ci \
            --set portfolioService.image=tradesphere/portfolio-service:ci \
            --set matchingEngine.image=tradesphere/matching-engine:ci \
            --set websocketService.image=tradesphere/websocket-service:ci \
            --set frontend.image=tradesphere/frontend:ci \
            | kubeval --strict --ignore-missing-schemas || true
