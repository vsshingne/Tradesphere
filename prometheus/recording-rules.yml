groups:
  # ============================================================
  # Pre-computed Recording Rules
  # These avoid expensive repeated computations in dashboards
  # ============================================================
  - name: tradesphere.recording
    rules:
      # --- Order throughput ---
      - record: job:tradesphere_orders:rate5m
        expr: sum(rate(tradesphere_orders_total[5m]))

      - record: job:tradesphere_orders:rate1h
        expr: sum(rate(tradesphere_orders_total[1h]))

      # --- Trade throughput ---
      - record: job:tradesphere_trades:rate5m
        expr: sum(rate(tradesphere_trades_total[5m]))

      - record: job:tradesphere_trades:rate1h
        expr: sum(rate(tradesphere_trades_total[1h]))

      # --- HTTP request rate per service ---
      - record: job:tradesphere_http_requests:rate5m
        expr: |
          sum(rate(tradesphere_http_request_duration_seconds_count[5m])) by (service)

      # --- HTTP error rate per service ---
      - record: job:tradesphere_http_errors:rate5m
        expr: |
          sum(rate(tradesphere_http_request_duration_seconds_count{status=~"5.."}[5m])) by (service)

      # --- HTTP error ratio per service ---
      - record: job:tradesphere_http_error_ratio:5m
        expr: |
          job:tradesphere_http_errors:rate5m
          /
          job:tradesphere_http_requests:rate5m

      # --- DB latency p50/p95/p99 ---
      - record: job:tradesphere_db_p50:5m
        expr: |
          histogram_quantile(0.50,
            sum(rate(tradesphere_db_query_duration_seconds_bucket[5m])) by (le, service)
          )

      - record: job:tradesphere_db_p95:5m
        expr: |
          histogram_quantile(0.95,
            sum(rate(tradesphere_db_query_duration_seconds_bucket[5m])) by (le, service)
          )

      - record: job:tradesphere_db_p99:5m
        expr: |
          histogram_quantile(0.99,
            sum(rate(tradesphere_db_query_duration_seconds_bucket[5m])) by (le, service)
          )

      # --- HTTP latency p50/p95/p99 per service ---
      - record: job:tradesphere_http_p50:5m
        expr: |
          histogram_quantile(0.50,
            sum(rate(tradesphere_http_request_duration_seconds_bucket[5m])) by (le, service)
          )

      - record: job:tradesphere_http_p95:5m
        expr: |
          histogram_quantile(0.95,
            sum(rate(tradesphere_http_request_duration_seconds_bucket[5m])) by (le, service)
          )

      - record: job:tradesphere_http_p99:5m
        expr: |
          histogram_quantile(0.99,
            sum(rate(tradesphere_http_request_duration_seconds_bucket[5m])) by (le, service)
          )

      # --- Reservation failure rate ---
      - record: job:tradesphere_reservation_failures:rate5m
        expr: rate(tradesphere_reservation_failures_total[5m])

      # --- Active WebSocket connections ---
      - record: job:tradesphere_websocket_clients:max5m
        expr: max_over_time(tradesphere_websocket_clients_active[5m])

      # --- Kafka consumer lag sum by consumer group ---
      - record: job:kafka_consumergroup_lag:sum
        expr: |
          sum(kafka_consumergroup_lag) by (consumergroup, topic)
